name: Auto Streak Keeper

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-Streak Keeper
        uses: bmiit145/auto-streak-keeper@v1.0.2
        with:
          min-commits: 1
          max-commits: 3
          user-name: JarysonUERN
          user-email: jarysonsimaum1@gmail.com
          github-token: ${{ secrets.GITHUB_TOKEN }}
